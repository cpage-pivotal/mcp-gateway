spring.application.name=mcp-gateway
server.port=8080

# Management/Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true

# Spring Cloud Gateway configuration
spring.cloud.gateway.routes[0].id=auth-login
spring.cloud.gateway.routes[0].uri=forward:/
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login
spring.cloud.gateway.routes[0].predicates[1]=Method=GET

spring.cloud.gateway.routes[1].id=auth-callback
spring.cloud.gateway.routes[1].uri=forward:/
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/callback
spring.cloud.gateway.routes[1].predicates[1]=Method=GET

spring.cloud.gateway.routes[2].id=auth-logout
spring.cloud.gateway.routes[2].uri=forward:/
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/logout
spring.cloud.gateway.routes[2].predicates[1]=Method=GET,POST

spring.cloud.gateway.routes[3].id=auth-status
spring.cloud.gateway.routes[3].uri=forward:/
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/status
spring.cloud.gateway.routes[3].predicates[1]=Method=GET

spring.cloud.gateway.routes[4].id=mcp-sse
spring.cloud.gateway.routes[4].uri=forward:/
spring.cloud.gateway.routes[4].predicates[0]=Path=/mcp/sse
spring.cloud.gateway.routes[4].predicates[1]=Method=GET

spring.cloud.gateway.routes[5].id=mcp-message
spring.cloud.gateway.routes[5].uri=forward:/
spring.cloud.gateway.routes[5].predicates[0]=Path=/mcp/message
spring.cloud.gateway.routes[5].predicates[1]=Method=POST

spring.cloud.gateway.routes[6].id=mcp-status
spring.cloud.gateway.routes[6].uri=forward:/
spring.cloud.gateway.routes[6].predicates[0]=Path=/mcp/status
spring.cloud.gateway.routes[6].predicates[1]=Method=GET

# MCP Server Configuration
mcp.server.url=${MCP_SERVER_URL:http://localhost:3000}
mcp.server.sse.path=${MCP_SERVER_SSE_PATH:/sse}
mcp.server.message.path=${MCP_SERVER_MESSAGE_PATH:/message}
mcp.connection.timeout=${MCP_CONNECTION_TIMEOUT:30000}
mcp.reconnect.attempts=${MCP_RECONNECT_ATTEMPTS:3}

# MCP Resilience Configuration
mcp.resilience.circuit.failure.threshold=${MCP_CIRCUIT_FAILURE_THRESHOLD:5}
mcp.resilience.circuit.timeout=${MCP_CIRCUIT_TIMEOUT:30000}
mcp.resilience.circuit.success.threshold=${MCP_CIRCUIT_SUCCESS_THRESHOLD:3}
mcp.resilience.retry.max.attempts=${MCP_RETRY_MAX_ATTEMPTS:3}
mcp.resilience.retry.base.delay=${MCP_RETRY_BASE_DELAY:1000}
mcp.resilience.retry.max.delay=${MCP_RETRY_MAX_DELAY:10000}

# MCP Connection Management
mcp.connection.idle.timeout=${MCP_CONNECTION_IDLE_TIMEOUT:300000}
mcp.connection.max.per.session=${MCP_CONNECTION_MAX_PER_SESSION:5}
mcp.connection.cleanup.interval=${MCP_CONNECTION_CLEANUP_INTERVAL:60000}

# OAuth2 Client Configuration (will be overridden by environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Redis Configuration for session storage
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Session configuration
spring.session.store-type=redis
spring.session.timeout=86400
